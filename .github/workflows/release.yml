name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      LICENSE_SERVER_URL: ${{ secrets.LICENSE_SERVER_URL }}
      LICENSE_ISSUER: ${{ secrets.LICENSE_ISSUER }}
      LICENSE_AUDIENCE: ${{ secrets.LICENSE_AUDIENCE }}
      LICENSE_PUBLIC_KEYS_JSON: ${{ secrets.LICENSE_PUBLIC_KEYS_JSON }}
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@1539798bf7f71455f77e682b9ca49078249b34e7
        with:
          fetch-all: true

      - name: Install service dependencies
        run: |
          npm ci --prefix services/licensing
          npm ci --prefix services/licensing-worker
          npm ci --prefix services/afdian-webhook-relay

      - name: Verify commercial release
        run: |
          npm run commercial:check
          npm run licenses:audit
          npm audit --omit=dev --audit-level=high
          npm audit --prefix services/licensing --omit=dev --audit-level=high
          npm audit --prefix services/licensing-worker --omit=dev --audit-level=high
          npm audit --prefix services/afdian-webhook-relay --omit=dev --audit-level=high
          npm run test
          npm run legacy-license:test
          npm run license:worker:test
          npm run license:worker:typecheck
          npm run license:worker:dry-run
          npm run afdian:relay:test
          npm run lint:check

      - name: Build release artifacts
        run: |
          npm run legacy-license:build
          npm run build
          npm run release:sbom
          npm run release:checksums

      - name: Release to GitHub
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
